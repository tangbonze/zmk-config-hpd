CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32


# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Runtime sensor rotate: the encoder binding is editable per layer from DYA
# Studio's "Sensor rotation" tab over the custom RPC subsystem "cormoran_rsr".
# https://github.com/cormoran/zmk-behavior-runtime-sensor-rotate
# This conf is included by both halves and both compile the shared keymap,
# whose sensor-bindings point at a zmk,behavior-runtime-sensor-rotate on every
# layer, so the behavior itself has to be built everywhere. Only the RPC half
# of the module is central-only; see HPD_right.conf.
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y
CONFIG_NEWLIB_LIBC=y
