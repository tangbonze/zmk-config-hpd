name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keymap_drawer.yml"
      - "keymap_drawer.config.yaml"
      - "config/**"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      amend_commit: false
      install_branch: "v0.23.0"
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml" # config file, ignored if not exists
      output_folder: "keymap-drawer"
      destination: "both"
      parse_args: ""  # map of extra args to pass to `keymap parse`, e.g. "corne:'-l Def Lwr Rse' cradio:''"
      draw_args: ""  # map of extra args to pass to `keymap draw`, e.g. "corne:'-k corne_rotated' cradio:'-k paroxysm'"

  # keymap-drawer only emits the combined HPD.svg. The README embeds the
  # per-layer files the README references, so regenerate them from the fresh
  # drawing and commit them alongside it.
  split-layers:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Split combined SVG into per-layer files
        run: python3 tools/split_keymap_svg.py
      - name: Commit per-layer SVGs
        run: |
          if git diff --quiet -- keymap-drawer/layers; then
            echo "Per-layer SVGs already up to date."
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add keymap-drawer/layers
          git commit -m "[Draw] split keymap SVG into per-layer images"
          git push
